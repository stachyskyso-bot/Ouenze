<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ouenze | Connexion pour changer le mot de passe</title>
    <link rel="icon" type="image/png" href="favicon/Icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }
        .login-header p {
            font-size: 13px;
            color: var(--gray-500);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-key"></i> Connexion requise</h1>
            <p>Connectez-vous pour changer votre mot de passe</p>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="votre@email.com">
        </div>
        <div class="form-group">
            <label>Mot de passe actuel</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn-submit" onclick="loginAndReset()">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
        <button class="btn-cancel" onclick="window.location.href='index.html'">
            Retour
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        async function loginAndReset() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Email et mot de passe requis");
                return;
            }

            console.log('🔐 Tentative de connexion...');

            const { data, error } = await window.supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error('❌', error);
                alert("Email ou mot de passe incorrect");
                return;
            }

            console.log('✅ Connecté:', data.user.email);
            alert(`Bienvenue ${data.user.email} ! Vous pouvez maintenant changer votre mot de passe.`);
            window.location.href = 'reset-password.html';
        }

        window.loginAndReset = loginAndReset;
    </script>
</body>
</html>
