<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ouenze | Création/Modification de boutique</title>
    <link rel="icon" type="image/png" href="favicon/Icon.png">
    <link rel="apple-touch-icon" href="favicon/Icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shop-designer.css">
</head>
<body>

<div class="header-simple">
    <button class="back-to-dashboard" onclick="window.location.href='vendor-dashboard.html'">
        <i class="fas fa-arrow-left"></i> Retour
    </button>
    <h1 id="pageTitle">Création de boutique</h1>
    <p>Personnalisez votre espace, gérez vos catégories et produits</p>
</div>

<div class="container">
    <div class="designer-layout">
        <!-- Panneau de configuration -->
        <div class="designer-panel">
            <h2 style="margin-bottom:16px;">Configuration</h2>
            
            <div class="design-section">
                <h3><i class="fas fa-store"></i> Informations</h3>
                <div class="form-group">
                    <label>Nom de la boutique *</label>
                    <input type="text" id="shopNameInput" placeholder="Ma boutique">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="shopDescInput" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ville</label>
                        <input type="text" id="shopCity">
                    </div>
                    <div class="form-group">
                        <label>Quartier</label>
                        <input type="text" id="shopQuartier">
                    </div>
                </div>
                <div class="form-group">
                    <label>Adresse détaillée</label>
                    <input type="text" id="shopAddress" placeholder="Rue, numéro">
                </div>
            </div>
            
            <div class="design-section">
                <h3><i class="fas fa-image"></i> Logo</h3>
                <div class="image-upload" onclick="document.getElementById('logoUpload').click()">
                    <div id="logoPreview" class="image-preview"><i class="fas fa-cloud-upload-alt"></i></div>
                    <div>Charger un logo</div>
                </div>
                <input type="file" id="logoUpload" accept="image/*" style="display:none;">
            </div>
            
            <div class="design-section">
                <h3><i class="fas fa-palette"></i> Couleurs</h3>
                <div class="form-group">
                    <label>Couleur principale</label>
                    <input type="color" id="primaryColor" value="#1e40af">
                </div>
                <div class="form-group">
                    <label>Couleur boutons</label>
                    <input type="color" id="buttonColor" value="#1e40af">
                </div>
                <div class="form-group">
                    <label>Fond boutique</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
                <div class="form-group">
                    <label>Texte header</label>
                    <input type="color" id="headerTextColor" value="#ffffff">
                </div>
                <div class="form-group">
                    <label>Texte produits</label>
                    <input type="color" id="productTextColor" value="#1e293b">
                </div>
            </div>
            
            <div class="design-section">
                <h3><i class="fas fa-tags"></i> Catégories</h3>
                <div id="categoriesContainer"></div>
                <button class="btn-secondary" style="width:100%; margin-top:10px;" onclick="window.addCategory()">
                    + Ajouter une catégorie
                </button>
            </div>
            
            <div class="design-section">
                <h3><i class="fas fa-box"></i> Produits</h3>
                <div id="productsContainer"></div>
                <button class="btn-secondary" style="width:100%; margin-top:10px;" onclick="window.openAddProductModal()">
                    + Ajouter un produit
                </button>
            </div>
            
            <button class="btn-primary" id="publishBtn" onclick="window.publishShop()">Publier ma boutique</button>
            <button class="btn-primary" id="updateBtn" style="display:none; background:var(--warning);" onclick="window.updateShop()">
                Mettre à jour
            </button>
        </div>
        
        <!-- Aperçu en temps réel -->
        <div class="designer-preview">
            <h3 style="margin-bottom:12px;">Aperçu en temps réel</h3>
            <div id="livePreview">
                <div style="text-align:center;padding:40px;color:var(--gray-500);">
                    <i class="fas fa-eye" style="font-size:48px;margin-bottom:16px;"></i>
                    <p>L'aperçu s'affichera ici</p>
                    <p style="font-size:12px;">Remplissez le nom de la boutique pour commencer</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal ajout/modification produit -->
<div id="productModal" class="modal">
    <div class="modal-card">
        <button class="modal-close" onclick="window.closeProductModal()">&times;</button>
        <h3 style="margin-bottom:20px;" id="modalTitle">Ajouter un produit</h3>
        <div id="productForm"></div>
    </div>
</div>

<!-- 1. Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Configuration Supabase -->
<script src="js/supabase-config.js"></script>

<!-- 3. Database -->
<script src="js/database.js"></script>

<!-- 4. Shop Designer -->
<script src="js/shop-designer.js"></script>
</body>
</html>
