<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouenze | Réinitialiser le mot de passe</title>
    <link rel="icon" type="image/png" href="favicon/Icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .reset-header p {
            font-size: 13px;
            color: var(--gray-500);
        }
        .reset-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 30px;
        }
        .info-box {
            background: #eef2ff;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .btn-full {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary-full {
            background: var(--primary);
            color: white;
        }
        .btn-primary-full:hover {
            background: var(--primary-dark);
        }
        .btn-outline-full {
            background: var(--gray-100);
            color: var(--gray-700);
            margin-top: 10px;
        }
        .btn-outline-full:hover {
            background: var(--gray-200);
        }
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: 0.3s;
            background: #e2e8f0;
        }
        .password-strength.weak { background: #ef4444; }
        .password-strength.medium { background: #f59e0b; }
        .password-strength.strong { background: #10b981; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="window.location.href='index.html'">
        <h1>OUENZE</h1>
    </div>
</div>

<div class="reset-container">
    <div class="reset-header">
        <div class="reset-icon">
            <i class="fas fa-key"></i>
        </div>
        <h1>Nouveau mot de passe</h1>
        <p>Choisissez un mot de passe sécurisé</p>
    </div>

    <div id="successMessage" class="success-message"></div>
    <div id="errorMessage" class="error-message"></div>

    <div id="formContainer">
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            Le mot de passe doit contenir au moins <strong>6 caractères</strong>.
        </div>

        <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
            <div class="password-strength" id="strengthBar"></div>
        </div>

        <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button class="btn-full btn-primary-full" onclick="updatePassword()">
            <i class="fas fa-check"></i> Enregistrer le mot de passe
        </button>

        <button class="btn-full btn-outline-full" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Retour à l'accueil
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
    console.log('🔐 reset-password.html chargé');

    // Indicateur de force
    const newPasswordInput = document.getElementById('newPassword');
    const strengthBar = document.getElementById('strengthBar');

    newPasswordInput.addEventListener('input', () => {
        const val = newPasswordInput.value;
        let strength = 'weak';
        if (val.length >= 10) strength = 'strong';
        else if (val.length >= 6) strength = 'medium';
        strengthBar.className = 'password-strength ' + strength;
    });

    // Mise à jour du mot de passe
    async function updatePassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if (!newPassword || !confirmPassword) {
            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Tous les champs sont requis';
            errorMsg.style.display = 'block';
            return;
        }

        if (newPassword.length < 6) {
            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Le mot de passe doit contenir au moins 6 caractères';
            errorMsg.style.display = 'block';
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Les mots de passe ne correspondent pas';
            errorMsg.style.display = 'block';
            return;
        }

        try {
            console.log('🔐 Mise à jour du mot de passe...');
            
            const { data: { user }, error: userError } = await window.supabase.auth.getUser();
            
            if (userError || !user) {
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Vous devez être connecté. <a href="index.html">Se connecter</a>';
                errorMsg.style.display = 'block';
                return;
            }

            console.log('👤 User:', user.email);

            const { error } = await window.supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                console.error('❌', error);
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + error.message;
                errorMsg.style.display = 'block';
                return;
            }

            console.log('✅ Mot de passe mis à jour !');
            successMsg.innerHTML = '<i class="fas fa-check-circle"></i> Mot de passe mis à jour avec succès !';
            successMsg.style.display = 'block';
            document.getElementById('formContainer').querySelectorAll('input').forEach(i => i.value = '');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);

        } catch (error) {
            console.error('❌', error);
            errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Une erreur est survenue';
            errorMsg.style.display = 'block';
        }
    }

    window.updatePassword = updatePassword;
</script>
</body>
</html>
