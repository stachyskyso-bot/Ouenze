<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouenze | Réinitialiser le mot de passe</title>
    <link rel="icon" type="image/png" href="favicon/Icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .reset-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .reset-header p {
            font-size: 13px;
            color: var(--gray-500);
        }
        .reset-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 30px;
        }
        .info-box {
            background: #eef2ff;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .btn-full {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary-full {
            background: var(--primary);
            color: white;
        }
        .btn-primary-full:hover {
            background: var(--primary-dark);
        }
        .btn-outline-full {
            background: var(--gray-100);
            color: var(--gray-700);
            margin-top: 10px;
        }
        .btn-outline-full:hover {
            background: var(--gray-200);
        }
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: 0.3s;
            background: #e2e8f0;
        }
        .password-strength.weak { background: #ef4444; }
        .password-strength.medium { background: #f59e0b; }
        .password-strength.strong { background: #10b981; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="window.location.href='index.html'">
        <h1>OUENZE</h1>
    </div>
</div>

<div class="reset-container">
    <div class="reset-header">
        <div class="reset-icon">
            <i class="fas fa-key"></i>
        </div>
        <h1>Nouveau mot de passe</h1>
        <p>Choisissez un mot de passe sécurisé</p>
    </div>

    <div id="successMessage" class="success-message"></div>
    <div id="errorMessage" class="error-message"></div>

    <div id="formContainer">
        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            Le mot de passe doit contenir au moins <strong>6 caractères</strong>.
        </div>

        <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
            <div class="password-strength" id="strengthBar"></div>
        </div>

        <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button class="btn-full btn-primary-full" onclick="updatePassword()">
            <i class="fas fa-check"></i> Enregistrer le mot de passe
        </button>

        <button class="btn-full btn-outline-full" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Retour à l'accueil
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

<script>
console.log('🔐 Page reset-password chargée');

const newPasswordInput =
    document.getElementById('newPassword');

const strengthBar =
    document.getElementById('strengthBar');

let recoverySessionReady = false;


/* ============================================================
   INDICATEUR DE FORCE
============================================================ */

newPasswordInput.addEventListener('input', () => {
    const value = newPasswordInput.value;

    strengthBar.className = 'password-strength';

    if (!value) {
        return;
    }

    if (value.length < 8) {
        strengthBar.classList.add('weak');
    }
    else if (
        value.length >= 8 &&
        value.length < 12
    ) {
        strengthBar.classList.add('medium');
    }
    else {
        strengthBar.classList.add('strong');
    }
});


/* ============================================================
   DÉTECTION DE LA SESSION DE RÉCUPÉRATION
============================================================ */

window.supabase.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            '🔐 Auth event:',
            event
        );

        if (
            event === 'PASSWORD_RECOVERY' ||
            session
        ) {
            recoverySessionReady = true;

            console.log(
                '✅ Session de récupération disponible'
            );
        }
    }
);


/* ============================================================
   VÉRIFICATION INITIALE
============================================================ */

async function checkRecoverySession() {

    const {
        data: { session },
        error
    } = await window.supabase.auth.getSession();

    if (error) {
        console.error(
            '❌ Erreur session:',
            error
        );

        return;
    }

    if (session) {
        recoverySessionReady = true;

        console.log(
            '✅ Session active détectée'
        );
    }
}

checkRecoverySession();


/* ============================================================
   MODIFICATION DU MOT DE PASSE
============================================================ */

async function updatePassword() {

    const newPassword =
        document
            .getElementById('newPassword')
            .value;

    const confirmPassword =
        document
            .getElementById('confirmPassword')
            .value;

    const errorMsg =
        document.getElementById('errorMessage');

    const successMsg =
        document.getElementById('successMessage');


    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';


    /* ---------- Validation ---------- */

    if (
        !newPassword ||
        !confirmPassword
    ) {
        showError(
            'Tous les champs sont requis.'
        );

        return;
    }


    if (newPassword.length < 8) {

        showError(
            'Le mot de passe doit contenir au moins 8 caractères.'
        );

        return;
    }


    if (
        newPassword !==
        confirmPassword
    ) {

        showError(
            'Les mots de passe ne correspondent pas.'
        );

        return;
    }


    /* ---------- Vérification session ---------- */

    const {
        data: { session }
    } = await window.supabase.auth.getSession();


    if (
        !recoverySessionReady &&
        !session
    ) {

        showError(
            "Le lien de récupération est invalide ou a expiré. " +
            "Demande un nouveau lien depuis la page de connexion."
        );

        return;
    }


    /* ---------- Modification ---------- */

    try {

        console.log(
            '🔐 Modification du mot de passe...'
        );


        const {
            data,
            error
        } = await window.supabase.auth.updateUser({
            password: newPassword
        });


        if (error) {
            throw error;
        }


        console.log(
            '✅ Mot de passe mis à jour',
            data.user?.email
        );


        successMsg.innerHTML = `
            <i class="fas fa-check-circle"></i>
            Mot de passe modifié avec succès !
            Vous allez être redirigé vers l'accueil.
        `;

        successMsg.style.display = 'block';


        document
            .getElementById('formContainer')
            .querySelectorAll('input')
            .forEach(input => {
                input.value = '';
            });


        setTimeout(
            async () => {

                await window.supabase.auth.signOut();

                window.location.href =
                    'index.html';

            },
            2000
        );


    } catch (error) {

        console.error(
            '❌ Modification impossible:',
            error
        );


        showError(
            error.message ||
            'Impossible de modifier le mot de passe.'
        );
    }
}


/* ============================================================
   ERREUR
============================================================ */

function showError(message) {

    const errorMsg =
        document.getElementById('errorMessage');

    errorMsg.innerHTML = `
        <i class="fas fa-exclamation-circle"></i>
        ${message}
    `;

    errorMsg.style.display = 'block';
}


/* ============================================================
   EXPORT
============================================================ */

window.updatePassword =
    updatePassword;

</script>
</body>
</html>
